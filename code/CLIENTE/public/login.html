<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/usuario.css">
    <link rel="stylesheet" href="./css/codigo2fa.css">
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/2716/2716612.png">
</head>
<body>
    <div class="menu-button">
        <button onclick="location.href='../maliciousClient/malicious_index.html'">😈</button>
    </div>
    
    <div class="container_login">

        <div class="botones">
            <button id="loginButton" class="active" onclick="location.href='login.html'">Login</button>
            <button id="registerButton" onclick="location.href='register.html'">Register</button>
        </div>
        <div class="form">
            <label for="username">Usuario:</label>
            <input class="login-input" type="text" id="username">
            <label for="password">Contraseña:</label>
            <input class="login-input" type="password" id="password">
            <button id="login" onclick="login()">Login</button>
        </div>
    </div>

    <div id="pantalla-codigo2fa" class="flex flex-col space-y-3 codigo2fa" data-hs-pin-input="">
        <h4 id="textoVerficacion">Introduzca el código de verificación enviado a su correo</h4>
        <div class="input-container">
            <input id="codigo1" type="text" maxlength="1" onkeyup="moveFocus(this, 'codigo2')">
            <input id="codigo2" type="text" maxlength="1" onkeyup="moveFocus(this, 'codigo3')">
            <input id="codigo3" type="text" maxlength="1" onkeyup="moveFocus(this, 'codigo4')">
            <input id="codigo4" type="text" maxlength="1" onkeyup="moveFocus(this, 'boton-verify')">
        </div>
        <button id="boton-verify" onclick="verificarCodigo2FA()">Verificar</button>
    </div>
    
    
    <script>
        function moveFocus(currentInput, nextElementId) {
            if (currentInput.value.length >= currentInput.maxLength) {
                var nextElement = document.getElementById(nextElementId);
                if (nextElement !== null) {
                    nextElement.focus();
                }
            }
        }
    </script>
    
    
    <script src="../prueba.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
